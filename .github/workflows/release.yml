name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v3.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Same checks as CI (syntax, version sync, luacheck),
  # run against the tag being released. Publishing waits for all of them.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag_name || github.ref }}
    permissions:
      contents: read

  package-and-release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # On manual runs package the requested tag, not whatever branch was selected.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Verify tag matches VERSION
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          TAG="$TAG_NAME"
          if [ -z "$TAG" ]; then
            echo "::error::No tag name - push a v* tag or pass tag_name to the manual run."
            exit 1
          fi
          VER="${TAG#v}"; VER="${VER#V}"
          MAIN=$(grep -oP "^local VERSION\s+= '\K[^']+" MCAC/lua/mcac/init.lua || true)
          if [ -z "$MAIN" ]; then
            echo "::error::Could not read local VERSION from MCAC/lua/mcac/init.lua"
            exit 1
          fi
          if [ "$VER" != "$MAIN" ]; then
            echo "::error::Tag $TAG does not match local VERSION = '$MAIN' in MCAC/lua/mcac/init.lua"
            exit 1
          fi
          echo "Tag $TAG matches VERSION $MAIN"

      - name: Generate Release Notes
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          python3 - << 'EOF'
          import os, re, sys

          tag = os.environ.get('TAG_NAME', '')
          version = re.sub(r'^[vV]', '', tag).strip()
          if not version:
              sys.exit('::error::No tag name given')

          # RELEASES.md holds a short, hand-written summary per release
          # (## <version> headings). CHANGELOG.md keeps the detailed history
          # and is linked from the release body instead of pasted into it.
          with open('RELEASES.md', 'r', encoding='utf-8') as f:
              content = f.read()

          entries = re.split(r'(?m)^## ', content)[1:]   # drop the file preamble
          if not entries:
              sys.exit('RELEASES.md has no "## <version>" entries')

          notes = None
          for entry in entries:
              heading, _, body = entry.partition('\n')
              if heading.strip() == version:
                  notes = body
                  break
          if notes is None:
              sys.exit(f'::error::RELEASES.md has no "## {version}" entry - add the release summary before tagging')

          # Drop the trailing entry separator if the author left one in.
          notes = re.sub(r'\n---\s*$', '', notes.strip()) + '\n'

          footer = """
          ---

          **Full change log:** [CHANGELOG.md](https://github.com/{repo}/blob/{tag}/CHANGELOG.md)

          ## 📦 Installation & Updating

          ### 🆕 New installation
          1. Download the latest **RoF2** MacroQuest from https://github.com/macroquest/macroquest/releases and extract it somewhere like `C:\\MacroQuest`.
          2. Download **`MCAC.zip`** from the Assets below. It has the Lua scripts and config.
          3. Extract the zip **into the root of your MacroQuest folder**. It merges `lua/` and `config/` into place.
          4. Windows users: add your MacroQuest folder as an antivirus exception before running it.
          5. Start `MacroQuest.exe`, then log into Project Triune. MCAC opens by itself when you log in - if you close it, type `/ac` or `/lua run mcac`.

          ### 🔄 Updating an existing installation
          1. Download **`MCAC.zip`** from the Assets below.
          2. Extract it **into the root of your MacroQuest folder** and overwrite files if asked.
          3. If MCAC was running, type `/ac restart` (or relog) to load the new version.

          *Your own settings and saved loadouts (`config/mcac_loadout_<server>_<char>.lua`, `config/mcac_chat_<Name>.lua`) are never overwritten.*
          """.format(repo=os.environ.get('GITHUB_REPOSITORY', 'Vaughnstrosity/Multi-Class-Auto-Combat'), tag=tag or 'main')
          footer = '\n'.join(line[10:] if line.startswith(' ' * 10) else line for line in footer.split('\n'))

          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + footer.rstrip() + '\n')

          print('Generated RELEASE_NOTES.md for', tag or '(no tag)')
          print(open('RELEASE_NOTES.md', encoding='utf-8').read())
          EOF

      - name: Package Release Archive
        run: |
          # Built from the MCAC/ tree so new modules and config files are picked up automatically.
          git archive --format=zip --add-file=README.md --add-file=CHANGELOG.md \
            -o MCAC.zip HEAD:MCAC .

      - name: Verify Archive Contents
        run: |
          set -e
          unzip -l MCAC.zip
          unzip -l MCAC.zip | grep -q 'lua/mcac/init.lua' || { echo "missing lua/mcac/init.lua"; exit 1; }
          echo "Archive verified"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MCAC.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
